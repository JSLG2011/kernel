name: Android Kernel Builder

on:
  workflow_dispatch: # Permite ejecutar el flujo manualmente desde la pestaña Actions
  push:
    branches:
      - main # Cambia 'main' por el nombre de tu rama si es diferente (ej. '13.0' o 'stock')

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código fuente
      uses: actions/checkout@v4

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git bc bison flex libssl-dev make libc6-dev libncurses5-dev \
          crossbuild-essential-arm64 crossbuild-essential-armhf \
          zip unzip libelf-dev clang lld

    - name: "Descargar Toolchain (AOSP Clang r383902)"
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchains/clang
        cd $GITHUB_WORKSPACE/toolchains/clang
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz
        tar -xzf clang-r383902.tar.gz
        rm clang-r383902.tar.gz

    - name: Configurar Variables de Compilación
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "PATH=$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH" >> $GITHUB_ENV
        # Nombre de tu defconfig (REEMPLAZA 'a32_defconfig' POR EL TUYO EXACTO)
        echo "DEFCONFIG=a32_defconfig" >> $GITHUB_ENV
        
    - name: "Dar permisos de ejecucion a scripts"
      run: |
        chmod -R +x scripts/
        chmod +x arch/arm64/kernel/vdso/gen_vdso_offsets.sh || true

    - name: "Generar la configuracion (make defconfig)"
      run: |
        make O=out ARCH=arm64 \
          CC=clang \
          HOSTCC=gcc \
          HOSTCXX=g++ \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          $DEFCONFIG

    - name: "Compilar el Kernel (make)"
      run: |
        make -j$(nproc --all) O=out \
          ARCH=arm64 \
          CC=clang \
          HOSTCC=gcc \
          HOSTCXX=g++ \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
    - name: Subir Artifact (Descargar el .zip listo)
      uses: actions/upload-artifact@v4
      with:
        name: Kernel
        path: Image
